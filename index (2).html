<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Bites Cafe | Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="menu-header">
        <h1>Fresh Bites Cafe</h1>
        <p>Delicious Drinks & Fresh Desserts</p>
    </header>

    <main class="menu-container">
        <h2>Our Special Menu</h2>
        
        <div class="menu-category">
            <h3>Beverages</h3>
            <div class="menu-item">
                <span class="item-name">Iced Latte</span>
                <span class="item-price">$4.50</span>
            </div>
            <div class="menu-item">
                <span class="item-name">Fresh Orange Juice</span>
                <span class="item-price">$3.50</span>
            </div>
        </div>

        <div class="menu-category">
            <h3>Desserts</h3>
            <div class="menu-item">
                <span class="item-name">Chocolate Cake</span>
                <span class="item-price">$5.00</span>
            </div>
            <div class="menu-item">
                <span class="item-name">Cheesecake</span>
                <span class="item-price">$5.50</span>
            </div>
        </div>
    </main>

    <footer>
        <p>Visit us daily: 8:00 AM - 10:00 PM | Designed by Maryam Owidan</p>
    </footer>

</body>
</html>
